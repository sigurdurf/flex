# Example Flex server configuration.
# Copy to `flex.toml` (or point the server at it with `--config <path>`).

# Address to bind. Use 0.0.0.0 to expose on the LAN.
host = "0.0.0.0"
port = 8096

# SQLite database file. Parent directory must exist and be writable.
database = "./data/flex.db"

# Optional: cache directory for extracted artwork/subtitles and playback
# (remux/transcode) session artifacts. Defaults to "./data/cache".
# cache_dir = "./data/cache"

# Enable remux/transcode via ffmpeg. When false, only direct play is offered.
transcode_enabled = true

# Maximum number of concurrent remux/transcode sessions. Direct play is
# unbounded by this limit. Keep this low on consumer GPUs (NVENC session cap).
max_transcode_sessions = 2

# Directories to index. Add one `[[libraries]]` table per library.
[[libraries]]
name = "Movies"
path = "/srv/media/movies"
kind = "movies"

[[libraries]]
name = "TV Shows"
path = "/srv/media/tv"
kind = "tv"

# File extensions treated as media during a scan.
extensions = ["mkv", "mp4", "m4v", "avi", "mov", "webm", "ts", "wmv", "flv", "mpg", "mpeg"]

# Directory holding the static web UI (the SPA in `web/`). Defaults to `./web`,
# resolved relative to the working directory and then the executable's directory
# when this key is unset. When no `web/` directory exists, static serving is
# simply disabled.
web_dir = "./web"

# Online subtitle search/download (OpenSubtitles.com). When no API key is set,
# the OpenSubtitles provider is not registered. Can also be supplied through the
# FLEX_OPENSUBTITLES_API_KEY environment variable.
# opensubtitles_api_key = "your-opensubtitles-api-key"
# opensubtitles_username = "your-username"
# opensubtitles_password = "your-password"

# Register the deterministic in-memory `mock` subtitle provider. TESTING ONLY —
# never enable this in a production deployment.
enable_mock_subtitles = false
